name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (core + dev, offline extras excluded)
        run: pip install -e '.[dev]'
      - name: Run the test suite with coverage
        run: pytest -q --cov=panda --cov=panda_tdr --cov=main --cov=config --cov-report=term-missing --cov-fail-under=75
